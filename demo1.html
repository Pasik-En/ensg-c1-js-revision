<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="m-4">
    
    <div class="flex flex-col gap-8">
        <div class="flex flex-col gap-3">
            <label for="number" class="font-bold text-3xl">Enter a Number</label>

            <input 
                type="number" 
                id="number-input"
                class="border border-black/50 h-10 px-2 rounded"
            >
        </div>

        <div class="flex flex-col gap-4 sm:flex-row ">
            <button 
                class="font-medium text-lg bg-yellow-300 cursor-pointer px-4"
                id="multiply-btn"
            >
                Multiply by 5
            </button>

            <button 
                class="font-medium text-lg bg-blue-300 cursor-pointer px-4"
                id="clear-btn"
            >
                Clear Output
            </button>
        </div>

        <p id="output" class="border-2 w-80 h-12 rounded text-4xl font-bold"></p>
    </div>

    <script src="demo1.js"></script>
</body>
</html>
